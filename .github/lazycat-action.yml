version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: dashgate
build:
  toolchains: []
  run_buildscript: false
images:
  - id: dashgate
    target: service
    service: dashgate
    source: khak1s/dashgate
    channel: stable
    sort: semver
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
stores:
  official:
    # 只发布喵喵（私有）商店，不走官方审核
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: DashGate
    summary: "自托管应用网关：一个面板管理所有服务，支持分组访问控制与应用自动发现"
